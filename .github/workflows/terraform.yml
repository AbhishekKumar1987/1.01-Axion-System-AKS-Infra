name: Deploy AKS Infrastructure with Terraform

on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.5.0"
  TF_WORKING_DIR: "environments/dev"

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Display Deployment Info
        run: |
          echo "AKS Infrastructure Deployment Completed"
          echo "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "AKS Cluster: aks-micro-dev"
          echo "ACR Name: acrmicrodev1987"
