name: Deploy AKS Infrastructure with Terraform

on:
  push:
    branches:
      - main
    paths:
      - '1.01-Axion-System-AKS-Infra/**'

  workflow_dispatch:

env:
  TF_VERSION: "1.5.0"
  TF_WORKING_DIR: "1.01-Axion-System-AKS-Infra/environments/dev"

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------
      # Azure CLI Login
      # -----------------------------------
      - name: Azure CLI Login
        shell: bash
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          az account show

      # -----------------------------------
      # Terraform Format
      # -----------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------
      # Terraform Init
      # -----------------------------------
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------
      # Terraform Validate
      # -----------------------------------
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------
      # Terraform Plan
      # -----------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------
      # Terraform Apply
      # -----------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------
      # Terraform Output
      # -----------------------------------
      - name: Terraform Output
        run: terraform output -json
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Display Deployment Info
        run: |
          echo "========================================="
          echo " AKS Infrastructure Deployment Completed"
          echo "========================================="
          echo "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "AKS Cluster: aks-micro-dev"
          echo "ACR Name: acrmicrodev1987"
          echo "========================================="
