name: Deploy AKS Infrastructure with Terraform

on:
  push:
    branches:
      - main
    paths:
      - '1.01-Axion-System-AKS-Infra/**'
      - '1.01-Axion-System-AKS-Infra/.github/workflows/terraform-deploy.yml'
  workflow_dispatch:

env:
  TF_VERSION: "1.5.0"
  TF_WORKING_DIR: "1.01-Axion-System-AKS-Infra/environments/dev"

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch'
    name: Terraform Plan and Apply
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Output
        run: |
          echo "=== Terraform Outputs ==="
          terraform output -json
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Display Deployment Info
        run: |
          echo "✅ AKS Infrastructure Deployment Completed"
          echo "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "AKS Cluster: aks-micro-dev"
          echo "ACR Name: acrmicrodev1987"
