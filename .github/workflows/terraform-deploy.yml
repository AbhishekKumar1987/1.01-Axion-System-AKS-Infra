name: Deploy AKS Infrastructure with Terraform

on:
  push:
    branches:
      - main
    paths:
      - '1.01-Axion-System-AKS-Infra/**'

  workflow_dispatch:

# Required for Azure OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.5.0"
  TF_WORKING_DIR: "1.01-Axion-System-AKS-Infra/environments/dev"

jobs:

  terraform:
    name: Terraform Plan and Apply
    runs-on: self-hosted

    steps:

      # ----------------------------------------
      # 1. Checkout Repository
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Terraform
      # ----------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ----------------------------------------
      # 3. Azure Login - OIDC
      # ----------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: azurecloud
          enable-AzPSSession: false


      # ----------------------------------------
      # 4. Verify Azure Login
      # ----------------------------------------
      - name: Verify Azure Login
        shell: pwsh
        run: |
          Write-Host "Azure Account Information:"
          az account show


      # ----------------------------------------
      # 5. Terraform Format Check
      # ----------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}


      # ----------------------------------------
      # 6. Terraform Init
      # ----------------------------------------
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}


      # ----------------------------------------
      # 7. Terraform Validate
      # ----------------------------------------
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}


      # ----------------------------------------
      # 8. Terraform Plan
      # ----------------------------------------
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}


      # ----------------------------------------
      # 9. Terraform Apply
      # ----------------------------------------
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}


      # ----------------------------------------
      # 10. Terraform Output
      # ----------------------------------------
      - name: Terraform Output
        run: |
          echo "=== Terraform Outputs ==="
          terraform output -json
        working-directory: ${{ env.TF_WORKING_DIR }}


      # ----------------------------------------
      # 11. Deployment Information
      # ----------------------------------------
      - name: Display Deployment Info
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " AKS Infrastructure Deployment Completed"
          Write-Host "========================================="
          Write-Host "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          Write-Host "AKS Cluster: aks-micro-dev"
          Write-Host "ACR Name: acrmicrodev1987"
          Write-Host "========================================="
